[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gongwen"
version = "0.1.0"
description = "公文智能体：面向中国内地公文场景的证据约束、规范校验与人机协同拟制系统（Protocol v1.0 参考实现）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GONGWEN contributors" }]
keywords = ["公文", "agent", "harness", "GB/T 9704", "official-document", "evidence"]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "pypdf>=4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
gongwen = "gongwen.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gongwen = [
  "knowledge/seed/*.yaml",
  "knowledge/seed/*.json",
  "layout/profiles/*.yaml",
  "layout/profiles/templates/*.yaml",
  "eval/cases/*.yaml",
  "eval/cases/materials/*",
  "profiles/*.yaml",
  "agent_skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
