# 第二组：事实与依据
- id: FB-01
  task_group: single
  kind: pipeline
  title: 拟议事项保持拟议语义，不写成已完成
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials:
    - &sit
      name: 情况说明.md
      text: |
        关于基层医疗示范点建设的情况说明

        为提升基层医疗卫生服务能力，我委于2025年启动基层医疗示范点建设。

        截至2025年12月31日，我委已建成基层医疗示范点8个，覆盖5个区。

        目前存在设备老化、服务能力不足等问题。

        2026年拟新建示范点12个，计划于2026年12月底前完成建设。
    - &budget
      name: 经费测算表.csv
      text: |
        项目,金额（万元）
        设备购置,60
        场地改造,40
        人员培训,20
        合计,120
  accept: [task_confirm, outline_confirm]
  expect:
    draft_contains: [拟新建示范点12个, 已建成基层医疗示范点8个]
    draft_not_contains: [已新建示范点12个, 已建成示范点12个, 建成示范点20个]
    numbers_sourced: true

