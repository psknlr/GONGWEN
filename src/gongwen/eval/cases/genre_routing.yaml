# 第一组：文种与行文（合成用例；机关名称均为“示例市/示例省”）
- id: GR-01
  task_group: single
  kind: pipeline
  title: 用户写“报告”，实质请求批准 → 请示
  request: 写一份向主管部门申请基层医疗示范点建设经费的报告
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials:
    - &sit
      name: 情况说明.md
      text: |
        关于基层医疗示范点建设的情况说明

        为提升基层医疗卫生服务能力，我委于2025年启动基层医疗示范点建设。

        截至2025年12月31日，我委已建成基层医疗示范点8个，覆盖5个区。

        目前存在设备老化、服务能力不足等问题。

        2026年拟新建示范点12个，计划于2026年12月底前完成建设。
    - &budget
      name: 经费测算表.csv
      text: |
        项目,金额（万元）
        设备购置,60
        场地改造,40
        人员培训,20
        合计,120
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 请示
    title_suffix: 的请示
    checkpoint_text: [更适合“请示”]
    draft_contains: [妥否，请批示。, 拟新建示范点12个]
    alternatives_include: [报告]

- id: GR-02
  task_group: single
  kind: pipeline
  title: 直接要求起草请示
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit, *budget]
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 请示
    draft_contains: [经费合计120万元, 妥否，请批示。]
    numbers_sourced: true

- id: GR-03
  task_group: single
  kind: pipeline
  title: 汇报情况、不请求批准 → 报告，且不夹带请示事项
  request: 向市政府报告2025年基层医疗示范点建设工作情况
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit]
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 报告
    title_suffix: 工作情况的报告
    draft_contains: [特此报告。]
    draft_not_contains: [请批示, 请批复, 报告报告]

- id: GR-04
  task_group: single
  kind: pipeline
  title: 部署工作 → 通知（下行文），材料中的全部任务都写入
  request: 起草一份部署2026年基层医疗示范点建设工作的通知
  hints: {recipients: 各区卫生健康局, issuer_type: 政府部门}
  materials:
    - name: 工作安排.md
      text: |
        2026年基层医疗示范点建设工作安排

        各区卫生健康局要在2026年6月底前完成选址。

        各区卫生健康局应当于2026年12月底前完成示范点建设并组织验收。

        市卫生健康委负责统筹协调和技术指导。
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 通知
    draft_contains: [2026年6月底前完成选址, 组织验收, 特此通知。]

- id: GR-05
  task_group: single
  kind: pipeline
  title: 向不相隶属的平级部门商请支持 → 函（平行文）
  request: 给示例市财政局发函，商请支持基层医疗示范点建设经费
  hints: {recipients: 示例市财政局, issuer_type: 政府部门}
  materials: [*sit]
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 函
    title_suffix: 建设经费的函
    draft_not_contains: [给示例市财政局发函, 请遵照执行]

- id: GR-06
  task_group: temporal
  kind: pipeline
  title: 部门向同级部门“申请”经费 → 提示不相隶属应用函
  request: 向主管部门申请专项经费
  hints: {issuer: 示例市卫生健康委员会, issuer_type: 政府部门, recipients: 示例市财政局}
  env: {unit_name: ""}
  human:
    - {at: 任务契约确认, option: accept}
  expect:
    authority_codes: [PEER_DEPARTMENT]
    alternatives_include: [函]

- id: GR-07
  task_group: adversarial
  kind: pipeline
  title: 部门内设机构对外正式行文 → 超出权限
  request: 向示例市财政局申请专项经费
  hints: {issuer: 示例市卫生健康委员会规划发展处, recipients: 示例市财政局, direction: 上行文}
  env: {unit_name: ""}
  human:
    - {at: 任务契约确认, option: accept}
  expect:
    stage: 超出权限
    pending_kinds: [权限与行文关系确认]
    checkpoint_text: [内设机构]

- id: GR-08
  task_group: single
  kind: check
  title: 报告中夹带请示事项
  text: |
    示例市卫生健康委员会关于2025年基层医疗示范点建设情况的报告
    示例市人民政府：
    现将2025年基层医疗示范点建设情况报告如下。
    截至2025年12月31日，已建成基层医疗示范点8个。
    恳请市政府安排专项经费120万元。
    妥否，请批示。
    示例市卫生健康委员会
    2026年1月10日
  expect:
    genre: 报告
    rules_present: [GW-GENRE-003]

- id: GR-09
  task_group: single
  kind: check
  title: 请示一文多事
  text: |
    示例市卫生健康委员会关于申请示范点建设经费和增加人员编制的请示
    示例市人民政府：
    为提升基层医疗卫生服务能力，现就有关事项请示如下。
    一、拟申请安排示范点建设经费120万元。
    二、拟申请增加人员编制10名。
    妥否，请批示。
    示例市卫生健康委员会
    2026年1月10日
  expect:
    genre: 请示
    rules_present: [GW-GENRE-002]

- id: GR-10
  task_group: single
  kind: check
  title: 函对不相隶属机关使用下行称谓与指令口吻
  text: |
    示例市卫生健康委员会关于商请支持基层医疗示范点建设的函
    示例市财政局：
    你局要高度重视基层医疗示范点建设，请遵照执行。
    示例市卫生健康委员会
    2026年1月10日
  expect:
    genre: 函
    rules_present: [GW-GENRE-006, GW-GENRE-007]

- id: GR-11
  task_group: single
  kind: check
  title: 上行文结束语与行文方向错位
  text: |
    示例市卫生健康委员会关于基层医疗示范点建设情况的报告
    示例市人民政府：
    现将基层医疗示范点建设情况报告如下。
    截至2025年12月31日，已建成基层医疗示范点8个。
    请遵照执行。
    示例市卫生健康委员会
    2026年1月10日
  expect:
    rules_present: [GW-GENRE-005]

- id: GR-12
  task_group: single
  kind: check
  title: 标题缺发文机关与文种、末尾加句号
  text: |
    做好示范点建设工作。
    各区卫生健康局：
    请各区卫生健康局于2026年6月30日前完成选址。
    示例市卫生健康委员会
    2026年1月10日
  expect:
    rules_present: [GW-FMT-009]

- id: GR-13
  task_group: single
  kind: check
  control: true
  title: 对照：规范的请示（不应有重要以上问题）
  text: |
    示例市卫生健康委员会关于申请基层医疗示范点建设经费的请示
    示例市人民政府：
    为提升基层医疗卫生服务能力，现就申请基层医疗示范点建设经费有关事项请示如下。
    截至2025年12月31日，我委已建成基层医疗示范点8个，覆盖5个区。2026年拟新建示范点12个，经测算所需经费120万元。
    拟申请安排经费120万元，用于基层医疗示范点建设。
    妥否，请批示。
    示例市卫生健康委员会
    2026年1月10日
  expect:
    genre: 请示
    max_issues: {阻断送审: 0, 重要: 0}

- id: GR-14
  task_group: single
  kind: pipeline
  title: 纪要只写确已议定事项，建议与未决事项列为待研究
  request: 根据会议记录整理一份示范点建设推进会的会议纪要
  hints: {issuer_type: 政府部门}
  materials:
    - name: 会议记录.md
      text: |
        示范点建设推进会会议记录

        2026年3月5日，示例市卫生健康委员会召开示范点建设推进会，委主任李某主持。

        会议决定，2026年新建示范点12个，由规划发展处牵头组织实施。

        会议同意将示范点验收时间定为2026年12月底前。

        规划发展处张某建议增加2个示范点，会议未作决定。

        财务处提出经费缺口约30万元，需进一步测算。
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 纪要
    title_suffix: 推进会纪要
    draft_contains: [委主任李某主持, 会议决定，2026年新建示范点12个]
    section_contains:
      会议议定事项: [新建示范点12个, 验收时间]
      待研究事项: [建议增加2个示范点, 经费缺口]
    section_not_contains:
      会议议定事项: [建议增加2个示范点, 经费缺口]

- id: GR-15
  task_group: single
  kind: pipeline
  title: 工作方案按契约分节、措施不重复，缺失的范围与进度以待补提示而不擅自补写
  request: 起草一份2026年基层医疗示范点建设工作方案
  hints: {issuer_type: 政府部门}
  materials:
    - name: 工作安排.md
      text: |
        2026年基层医疗示范点建设工作安排

        2026年拟新建示范点12个。

        各区卫生健康局要在2026年6月底前完成选址。

        各区卫生健康局应当于2026年12月底前完成示范点建设并组织验收。

        市卫生健康委负责统筹协调和技术指导。
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 工作方案
    section_contains:
      工作目标: [拟新建示范点12个]
      主要任务: [完成选址, 组织验收]
      职责分工: [负责统筹协调]
      工作范围: [【待补]
      进度安排: [【待补]
    max_occurrences: {完成选址: 1, 负责统筹协调: 1}


- id: GR-16
  task_group: adversarial
  kind: pipeline
  title: 政府部门向下级人民政府发指令性通知 → 超出权限
  request: 起草一份要求各区人民政府加快示范点建设的通知
  hints: {recipients: 各区人民政府, issuer_type: 政府部门}
  materials:
    - name: 情况说明.md
      text: |
        2026年拟新建示范点12个，计划于2026年12月底前完成建设。
  human:
    - {at: 任务契约确认, option: accept}
  expect:
    stage: 超出权限
    authority_codes: [DEPT_TO_LOWER_GOV]

- id: GR-17
  task_group: single
  kind: pipeline
  title: 医院参照执行：请示自称“我院”，并提示参照执行不等同于行政机关权限
  request: 起草一份向市卫生健康委员会申请购置医疗设备经费的请示
  hints: {recipients: 示例市卫生健康委员会, issuer_type: 医院}
  env: {unit_profile: hospital, unit_name: 示例市第一人民医院}
  materials:
    - name: 设备购置说明.md
      text: |
        为提升急诊救治能力，我院拟购置除颤仪10台，计划于2026年6月底前完成采购。
    - name: 经费测算表.csv
      text: |
        项目,金额（万元）
        除颤仪,50
        合计,50
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 请示
    draft_contains: [我院, 经费合计50万元]
    draft_not_contains: [我委]

- id: GR-18
  task_group: multi
  kind: pipeline
  title: 批复：引用来文标题与文号，答复意见只来自会议决定（金额以决定为准，不取来文申请数）
  request: 起草一份对市卫生健康委员会请示的批复
  hints: {recipients: 示例市卫生健康委员会, issuer_type: 人民政府}
  env: {unit_name: 示例市人民政府}
  materials:
    - name: 来文请示.txt
      text: |
        示例市卫生健康委员会关于申请基层医疗示范点建设经费的请示
        示卫〔2026〕5号
        示例市人民政府：
        为提升基层医疗卫生服务能力，现就申请基层医疗示范点建设经费有关事项请示如下。
        2026年拟新建示范点12个，所需经费合计120万元。
        妥否，请批示。
        示例市卫生健康委员会
        2026年3月1日
    - name: 常务会议纪要摘录.md
      text: |
        2026年3月20日，市政府常务会议研究决定：同意安排基层医疗示范点建设经费100万元，由市财政局从2026年卫生健康专项资金中列支。
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 批复
    draft_contains: [示例市人民政府关于申请基层医疗示范点建设经费的批复, 你委《示例市卫生健康委员会关于申请基层医疗示范点建设经费的请示》（示卫〔2026〕5号）收悉, 100万元, 此复]
    draft_not_contains: [120万元, 【待补：答复意见, 你市]
    numbers_sourced: true

- id: GR-19
  task_group: adversarial
  kind: pipeline
  title: 批复缺少真实决定：不代为“同意”，答复意见留占位并提示
  request: 起草一份对市卫生健康委员会请示的批复
  hints: {recipients: 示例市卫生健康委员会, issuer_type: 人民政府}
  env: {unit_name: 示例市人民政府}
  materials:
    - name: 来文请示.txt
      text: |
        示例市卫生健康委员会关于申请基层医疗示范点建设经费的请示
        示卫〔2026〕5号
        示例市人民政府：
        2026年拟新建示范点12个，所需经费合计120万元。
        妥否，请批示。
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 批复
    draft_contains: [【待补：答复意见, 收悉]
    draft_not_contains: [同意安排, 120万元]

- id: GR-20
  task_group: multi
  kind: pipeline
  title: 复函：引来函标题与文号、称“贵局”、结束语“特此函复”，来函自身的请求与背景不写成本机关事实
  request: 起草一份答复市财政局来函的复函
  hints: {recipients: 示例市财政局, issuer_type: 政府部门}
  materials:
    - name: 来函.txt
      text: |
        示例市财政局关于商请提供基层医疗示范点建设情况的函
        示财函〔2026〕8号
        示例市卫生健康委员会：
        为做好2026年预算编制工作，请贵委提供基层医疗示范点建设情况及2026年经费需求。
        特此函达。
        示例市财政局
        2026年2月10日
    - name: 情况说明.md
      text: |
        截至2025年12月31日，我委已建成基层医疗示范点8个，覆盖5个区。

        2026年拟新建示范点12个，所需经费合计120万元。
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 函
    draft_contains: [关于提供基层医疗示范点建设情况的复函, 贵局《示例市财政局关于商请提供基层医疗示范点建设情况的函》（示财函〔2026〕8号）收悉, 已建成基层医疗示范点8个, 特此函复]
    draft_not_contains: [请贵委提供, 为做好2026年预算编制工作, 请函复, 函商]
    numbers_sourced: true

- id: GR-21
  task_group: single
  kind: pipeline
  title: 印发类通知：通知正文只写印发事项，方案作为附件，标题加书名号
  request: 起草一份印发基层医疗示范点建设工作方案的通知
  hints: {recipients: 各区卫生健康局, issuer_type: 政府部门}
  materials:
    - name: 工作安排.md
      text: |
        2026年拟新建示范点12个。

        各区卫生健康局要在2026年6月底前完成选址。

        市卫生健康委负责统筹协调和技术指导。
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 通知
    draft_contains: [关于印发《基层医疗示范点建设工作方案》的通知, 现将《基层医疗示范点建设工作方案》印发给你们]
    attachment_text_contains: [2026年拟新建示范点12个, 负责统筹协调]
    draft_not_contains: [《印发]

- id: GR-22
  task_group: adversarial
  kind: pipeline
  title: 表彰通报：材料中没有表彰决定时不代为决定，留待补；先进事迹照材料写
  request: 起草一份表彰2025年度基层医疗示范点建设先进单位的通报
  hints: {recipients: 各区卫生健康局, issuer_type: 政府部门}
  materials:
    - name: 先进单位推荐情况.md
      text: |
        经各区推荐，甲区卫生健康局、乙区卫生健康局在2025年基层医疗示范点建设中成效突出，分别建成示范点3个和2个。
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    genre: 通报
    draft_contains: [分别建成示范点3个和2个, 【待补：表彰或批评决定, 特此通报]
    draft_not_contains: [决定对, 予以通报表彰, 一、]
    rules_absent_open: [GW-SEM-006]

- id: GR-23
  task_group: single
  kind: pipeline
  title: 批评通报：问题事实写入通报正文，不因含“滞后”被当作评价；没有要求时不留空泛待补
  request: 起草一份关于部分区示范点建设进度滞后情况的通报
  hints: {recipients: 各区卫生健康局, issuer_type: 政府部门}
  materials:
    - name: 督查情况.md
      text: |
        2026年6月督查发现，丙区、丁区示范点建设进度滞后，截至2026年5月31日仅完成年度任务的20%。
  accept: [task_confirm, outline_confirm]
