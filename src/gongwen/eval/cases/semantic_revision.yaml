- id: SR-11
  task_group: single
  kind: check
  title: 新增高频报送要求（减负）
  text: |
    示例市卫生健康委员会关于做好示范点建设工作的通知
    各区卫生健康局：
    各区卫生健康局要每周报送示范点建设进展情况表，并建立工作台账。
    示例市卫生健康委员会
    2026年1月10日
