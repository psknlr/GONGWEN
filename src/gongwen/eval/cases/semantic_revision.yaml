# 第三组：语义与修订
- id: SR-01
  task_group: multi
  kind: revision
  title: 关键事实变更联动正文合计、请示事项与附件表格
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials:
    - &sit
      name: 情况说明.md
      text: |
        关于基层医疗示范点建设的情况说明

        为提升基层医疗卫生服务能力，我委于2025年启动基层医疗示范点建设。

        截至2025年12月31日，我委已建成基层医疗示范点8个，覆盖5个区。

        目前存在设备老化、服务能力不足等问题。

        2026年拟新建示范点12个，计划于2026年12月底前完成建设。
    - &budget
      name: 经费测算表.csv
      text: |
        项目,金额（万元）
        设备购置,60
        场地改造,40
        人员培训,20
        合计,120
  accept: [task_confirm, outline_confirm]
  revise:
    fact_changes:
      - {attribute: 设备购置, new_value: 40, reason: 核减}
  expect:
    draft_contains: [经费合计100万元, 拟申请安排经费100万元]
    draft_not_contains: [经费合计120万元, 拟申请安排经费120万元]
    attachment_table_contains: ["40", "100"]

- id: SR-02
  task_group: adversarial
  kind: revision
  title: 人工把“拟新建”改成“已新建” → 事实状态升级被标出并转人工
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit, *budget]
  accept: [task_confirm, outline_confirm]
  revise:
    edits:
      - {find: 2026年拟新建示范点12个, replace: 2026年已新建示范点12个}
  expect:
    rules_present: [GW-FACT-001]
    doc_status: 讨论稿

- id: SR-03
  task_group: adversarial
  kind: revision
  title: 人工写入“经市政府批准” → 未经真实批准不得写成已批准
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit, *budget]
  accept: [task_confirm, outline_confirm]
  revise:
    edits:
      - {find: 2026年拟新建示范点12个, replace: 经市政府批准，2026年拟新建示范点12个}
  expect:
    rules_present: [GW-SEM-006]

- id: SR-04
  task_group: multi
  kind: revision
  title: 人工修改引入半角标点 → 定向修订自动纠正（机械性问题）
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit, *budget]
  accept: [task_confirm, outline_confirm]
  revise:
    edits:
      - {find: "我委已建成基层医疗示范点8个，覆盖5个区", replace: "我委已建成基层医疗示范点8个,覆盖5个区"}
  expect:
    rules_absent_open: [GW-PUNC-001]
    draft_contains: [已建成基层医疗示范点8个，覆盖5个区]

- id: SR-05
  task_group: adversarial
  kind: revision
  title: 已绑定审批的版本发生实质修改 → 审批失效，须报原签批人复审
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit, *budget]
  accept: [task_confirm, outline_confirm]
  revise:
    approve_first: true
    fact_changes:
      - {attribute: 设备购置, new_value: 40, reason: 核减}
  expect:
    errors_contain: [须报原签批人复审]
    log_events: [approval.invalidated]

- id: SR-06
  task_group: adversarial
  kind: pipeline
  title: 无头模式即使授权自动接受，也不能越过人工送审
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit, *budget]
  accept: [task_confirm, outline_confirm, review_escalation, conflict]
  expect:
    stage: 人工送审
    pending_kinds: [人工送审]

- id: SR-07
  task_group: adversarial
  kind: model
  title: 模型擅自写入“经市政府研究同意” → 校验器拒绝
  model: approval_claim
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit, *budget]
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    draft_not_contains: [经市政府研究同意]

- id: SR-08
  task_group: adversarial
  kind: model
  title: 模型拒答 → 显式记录并回退确定性路径，不把空结果当成功
  model: refuse
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials: [*sit, *budget]
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    draft_contains: [拟新建示范点12个]
    log_events: [skill.model_skipped]

