- id: FL-13
  task_group: single
  kind: check
  control: true
  title: 对照：格式规范的函（不应有重要以上问题）
  text: |
    示例市卫生健康委员会关于商请支持基层医疗示范点建设经费的函
    示例市财政局：
    为提升基层医疗卫生服务能力，我委拟于2026年新建基层医疗示范点12个，经测算所需经费120万元。现就有关事项函商如下：恳请贵局对示范点建设经费予以支持。
    请予支持为盼。
    示例市卫生健康委员会
    2026年1月5日
  expect:
    genre: 函
    max_issues: {阻断送审: 0, 重要: 0}

- id: FL-14
  task_group: single
  kind: pipeline
  title: 生成的请示通过版式参数回读核验（不依赖渲染工具）
  request: 起草一份向市政府申请基层医疗示范点建设经费的请示
  hints: {recipients: 示例市人民政府, issuer_type: 政府部门}
  materials:
    - name: 情况说明.md
      text: |
        为提升基层医疗卫生服务能力，我委于2025年启动基层医疗示范点建设。

        2026年拟新建示范点12个，计划于2026年12月底前完成建设。
    - name: 经费测算表.csv
      text: |
        项目,金额（万元）
        设备购置,60
        合计,60
  accept: [task_confirm, outline_confirm]
  expect:
    stage: 人工送审
    log_events: [skill.layout]

