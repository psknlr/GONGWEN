# 第四组：格式与版式（GB/T 9704—2012、GB/T 15834—2011、GB/T 15835—2011）
- id: FL-01
  task_group: single
  kind: check
  title: 发文字号用方括号、加“第”、编虚位
  text: |
    示例市卫生健康委员会文件
    示卫发[2026]第05号
