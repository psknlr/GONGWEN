- id: FL-17
  task_group: adversarial
  kind: check
  title: 综合差错（上行文）：标题末尾标点不影响文种识别；报告夹带请示、你局、抄送下级、年份简写、旧规、引用顺序、附件序号与标点、汉字成文日期
  text: |
    示例市卫生健康委员会关于申请示范点建设经费和增加人员编制的报告。
    示例市人民政府、示例市财政局:
    日前，根据示政发〔2025〕3号《示例市基层医疗卫生服务体系建设规划》和《国家行政机关公文处理办法》有关规定,我委开展了基层医疗示范点建设。
    一、基本情况
    截至25年底，我委已建成示范点8个，覆盖5个区，你局给予了大力支持。
    1.存在问题
    部分示范点设备老化，服务人次较2024年下降3-5个百分点。
    二、请示事项
    （一）申请安排示范点建设经费120万元。
    （二）申请增加人员编制10名。
    以上报告，妥否，请批示。
    附件：1、经费测算表。
    2、人员编制需求表。
    示例市卫生健康委员会
    二〇二六年三月一日
    抄送：各区卫生健康局
  expect:
    genre: 报告
    rules_present: [GW-GENRE-003, GW-GENRE-006, GW-ROUTE-001, GW-ROUTE-002, GW-NUM-001, GW-BASIS-002, GW-BASIS-004, GW-FMT-002, GW-FMT-003, GW-FMT-009, GW-PUNC-001, GW-PUNC-004, GW-STRUCT-001, GW-STYLE-003]
    rules_absent: [GW-BURDEN-001, GW-GENRE-008]

- id: FL-18
  task_group: adversarial
  kind: check
  title: 综合差错（下行文）：通知中出现“妥否”、贵局、重复标点、截止/截至、层次跳级、全角数字、“号”作日期、新增高频报送与留痕、引用不存在的附件
  text: |
    示例市卫生健康委员会关于开展2026年基层医疗机构安全检查的通知
    各区卫生健康局：
    为进一步加强基层医疗机构安全管理，现就有关事项通知如下：
    一、检查范围
    全市各级各类基层医疗机构，包括社区卫生服务中心、乡镇卫生院、村卫生室等等。
    （1）检查内容
    重点检查消防、用电、危化品管理等，，具体见附件2。
    二、时间安排
    检查时间为2026年4月1号至4月30号，截止2026年3月底，全市共有基层医疗机构１２３家。
    三、工作要求
    各区要高度重视，每周报送检查进展情况，并于每月5日前上报工作台账和照片。
    请贵局认真组织实施。
    妥否，请批示。
    附件：检查表
    示例市卫生健康委员会
    2026年3月15日
  expect:
    genre: 通知
    rules_present: [GW-GENRE-003, GW-GENRE-005, GW-GENRE-006, GW-PUNC-001, GW-STYLE-004, GW-STRUCT-001, GW-NUM-006, GW-NUM-007, GW-BURDEN-001, GW-FMT-004]
