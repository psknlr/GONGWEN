# 语义强度、状态、范围、决策、负担、文风等词表（level: 实务，可由单位配置覆盖或扩充）。

# 义务强度（数值越大越强；禁止性用语按强义务处理）
obligation:
  必须: 5
  务必: 5
  一律: 5
  严禁: 5
  禁止: 5
  不得: 4.5
  应当: 4
  须: 4
  应: 4
  要: 3
  需要: 3
  需: 3
  原则上: 2
  一般: 2
  可以: 1
  可: 1
  鼓励: 0.5
  支持: 0.5
  提倡: 0.5
  研究探索: 0.2
  探索: 0.2
  研究: 0.2
  视情: 0.8

# 事项进展：拟议 < 推进中 < 已完成
progress:
  planned: [拟, 计划, 将, 准备, 预计, 打算, 待, 争取, 力争, 拟于, 预期, 目标是]
  ongoing: [正在, 正抓紧, 推进中, 逐步, 持续推进, 已启动]
  done: [已, 已经, 完成, 建成, 实现, 达到, 取得, 落成, 全面完成, 已建成, 已完成, 已实现, 已开展, 已落实]

# 实施范围
scope:
  narrow: [试点, 部分, 选取, 个别, 若干, 重点, 先行, 局部, 示范]
  broad: [全面, 全部, 所有, 全域, 全覆盖, 一律, 各地, 全市, 全省, 全系统, 普遍]

# 决策状态（纪要尤其要区分）
decision:
  discussion: [讨论, 研究了, 交流, 听取, 提出, 建议, 认为, 发言, 酝酿, 议论]
  decided: [决定, 议定, 同意, 批准, 通过, 确定, 明确, 原则同意, 会议要求]

# 条件与例外：删除后会改变适用范围
hedges: [原则上, 一般, 确有需要, 必要时, 特殊情况, 经批准, 视情况, 根据需要, 除外, 另有规定的除外, 符合条件的]

