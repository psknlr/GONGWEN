# 新增报送、填表、考核、留痕要求（设计 §2.3、§6.4）
burden_terms:
  report: [报送, 上报, 填报, 报表, 统计表, 月报, 周报, 日报, 季报, 总结报告, 进展情况报告, 佐证材料, 工作台账, 台账]
  assessment: [考核, 排名, 督查, 检查, 通报批评, 问责, 一票否决, 纳入考评, 打分]
  trace: [留痕, 打卡, 签到, 拍照, 照片, 视频, 工作日志, 签订责任书, 承诺书, 截图]
frequency: [每日, 每天, 每周, 每月, 每季度, 每半年, 每年, 定期, 随时, 实时]

# 相对时间（实务：日期应写明具体年月日）
relative_time: [今年, 去年, 前年, 明年, 本月, 上月, 下月, 本周, 上周, 下周, 日前, 近日, 近期, 最近, 昨天, 今天, 明天]

# 称谓（实务）：你X 仅用于下行文；贵X 不得用于下行文
address:
  down_only: [你部, 你局, 你委, 你厅, 你办, 你单位, 你院, 你校, 你省, 你市, 你区, 你县, 你们]
  respectful: [贵部, 贵局, 贵委, 贵厅, 贵办, 贵单位, 贵院, 贵校, 贵司, 贵公司]

# 指令口吻（平行文“函”中慎用）
command_tone: [请遵照执行, 请认真贯彻执行, 务必, 必须按时, 严格执行, 不得有误, 请贯彻落实]

# 请求批准类表述（报告中出现即视为夹带请示）
request_phrases: [请批示, 请批复, 请予批准, 请审批, 请予审批, 妥否, 当否, 请予批复, 请予同意, 请审定, 恳请批准, 请予核拨, 请予支持]

# 高频易混字词（实务）
wording:
  - {wrong: 其它, right: 其他, note: 公文统一用“其他”}
  - {pattern: "截止(?=\\d{4}年|\\d{1,2}月|目前|今年|本月)", right: 截至, note: “截至”带时间宾语，“截止”不带宾语}
  - {wrong: 法制建设, right: 法治建设, note: 依法治理的动态过程用“法治”}
  - {wrong: 交待, right: 交代, note: 交接、嘱咐、说明用“交代”}
  - {wrong: 通讯畅通, right: 通信畅通, note: 信息传递用“通信”}
  - {wrong: 藉此, right: 借此, note: “藉”表凭借义已简化为“借”}
  - {wrong: 所必须的, right: 所必需的, note: “必需”表示不可少}
  - {wrong: 情况反应, right: 情况反映, note: 告知、表现用“反映”}

