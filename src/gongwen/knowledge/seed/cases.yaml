# 历史案例与文风库（种子）：合成示例，仅作结构与表达参考，source 标注来源与授权。
# 实际部署时由单位导入经授权、审核的历史范文；检索结果中的数字、机构、日期会被脱敏。

- case_id: C-TZ-01
  genre: 通知
  scenario: 部署开展专项工作（事务类通知）
  source: 合成示例（仅结构参考）
  structure: [通知事由, 适用对象, 通知事项, 执行要求, 时限和反馈方式]
  phrases:
    opening: ["为{目的}，根据{依据}，现就{事项}有关事项通知如下：", "为做好{事项}工作，现将有关事项通知如下："]
    transition: ["现将有关事项通知如下："]
    requirement: ["各单位要明确责任人员，按要求抓好落实。", "请于{日期}前将{材料}报送{单位}。"]
    closing: ["特此通知。"]
  text: >-
    为做好某项工作，根据有关文件要求，现就有关事项通知如下：一、工作范围。二、主要任务。三、工作要求。特此通知。

- case_id: C-TZ-02
  genre: 通知
  scenario: 印发工作方案（印发类通知）
  source: 合成示例（仅结构参考）
  structure: [印发对象, 执行要求]
  phrases:
    opening: ["现将《{文件名称}》印发给你们，请结合实际认真贯彻执行。", "《{文件名称}》已经{机关}同意，现印发给你们，请认真组织实施。"]
    closing: []
  text: 现将《某工作方案》印发给你们，请结合实际认真组织实施。

- case_id: C-QS-01
  genre: 请示
  scenario: 申请专项经费
  source: 合成示例（仅结构参考）
  structure: [请示缘由, 基本情况, 必要性和依据, 拟议方案, 经费测算及来源, 请示事项, 结语]
  phrases:
    opening: ["为{目的}，根据{依据}，结合{单位}实际，现就{事项}请示如下：", "现就{事项}有关事项请示如下："]
    request: ["拟申请{来源}安排经费{金额}，用于{用途}。"]
    closing: ["妥否，请批示。", "以上请示，请予批复。"]
  text: >-
    为推进某项工作，根据有关文件要求，结合本单位实际，现就申请某项经费有关事项请示如下：一、基本情况。二、申请理由。三、拟议方案。四、经费测算。妥否，请批示。

- case_id: C-BG-01
  genre: 报告
  scenario: 报告阶段性工作情况
  source: 合成示例（仅结构参考）
  structure: [工作开展情况, 取得的成效, 存在的问题及原因, 下一步工作安排, 结语]
  phrases:
    opening: ["根据{要求}，现将{事项}有关情况报告如下：", "现将{时段}{事项}工作情况报告如下："]
    closing: ["特此报告。"]
  text: 根据有关要求，现将某项工作开展情况报告如下：一、工作开展情况。二、存在的问题。三、下一步工作安排。特此报告。

- case_id: C-HAN-01
  genre: 函
  scenario: 商洽工作、请求协助
  source: 合成示例（仅结构参考）
  structure: [背景, 商洽事项, 明确请求, 联系方式, 结语]
  phrases:
    opening: ["为{目的}，现就{事项}函商如下：", "因{事由}，拟请贵单位{请求}。"]
    reply_opening: ["贵单位《关于{事项}的函》（{文号}）收悉。经研究，现函复如下："]
    closing: ["请予支持为盼。", "特此函复。", "盼复。"]
  text: 为推进某项合作，现就有关事项函商如下：拟请贵单位提供某项支持。请予支持为盼。

- case_id: C-JY-01
  genre: 纪要
  scenario: 办公会议纪要
  source: 合成示例（仅结构参考）
  structure: [会议基本信息, 主要情况, 议定事项, 待研究事项, 出席请假列席]
  phrases:
    opening: ["{日期}，{主持人}主持召开{会议名称}，研究{议题}。现将会议议定事项纪要如下："]
    decided: ["会议议定：", "会议明确："]
    pending: ["会议提出，以下事项待进一步研究："]
  text: 某日，某负责同志主持召开办公会议，研究某项工作。现将会议议定事项纪要如下：一、会议议定。二、待研究事项。

- case_id: C-FA-01
  genre: 工作方案
  scenario: 专项工作方案
  source: 合成示例（仅结构参考）
  structure: [总体要求, 工作目标, 工作范围, 主要任务, 职责分工, 进度安排, 保障措施, 评价方式]
  phrases:
    opening: ["为{目的}，根据{依据}，结合实际，制定本方案。"]
  text: 为推进某项工作，根据有关文件，结合实际，制定本方案。一、工作目标。二、主要任务。三、进度安排。四、保障措施。

- case_id: C-PF-01
  genre: 批复
  scenario: 答复下级请示
  source: 合成示例（仅结构参考）
  structure: [引来文, 答复意见, 执行要求, 结语]
  phrases:
    opening: ["你{简称}《关于{事项}的请示》（{文号}）收悉。经研究，现批复如下："]
    closing: ["此复。"]
  text: 你单位《关于某事项的请示》收悉。经研究，现批复如下：一、同意某事项。二、有关要求。此复。
