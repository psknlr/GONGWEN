  subject_mode: 依照
  matters:
  - 人工智能
  - 大模型
  - 辅助文书起草
  - 保密
  - 数据安全
  source_url: https://www.cac.gov.cn/2025-10/10/c_1761819469929310.htm
  fetched_at: '2026-10-02T00:00:00Z'
  verification: 已核（官方来源）
  notes: 全文页（中国网信网，2025年10月10日19:53）未载发文机关；发文机关依据同日中国网信网新闻稿“中央网信办、国家发展改革委近日联合印发”（https://www.cac.gov.cn/2025-10/10/c_1761819469876932.htm），新华网同日20:12转载（来源：“网信中国”微信公众号）。确切印发日期未公开（“近日”），publish_date
    取官方公开发布日期2025-10-10。未见文号；文件无施行日期条款，故 effective_date 为 null。新闻稿称其落实《关于深入实施“人工智能+”行动的意见》要求。status：截至2026-10-02未检索到修订/调整版本（文件自述将“进行动态调整”）。
  articles:
  - article_no: 前言（定位与动态调整）
    text: 本指引主要为各级政务部门提供人工智能大模型部署应用的工作导向和基本参照，将根据实践进展，结合人工智能大模型发展和应用的新形势、新要求，进行动态调整。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、应用场景（三）机关办公类 第7项 辅助文书起草
    text: 7.辅助文书起草。利用大语言模型的生成能力，通过构建本地知识库和预设模板，为工作人员提供写作建议、辅助起草文书，对格式和内容等进行检查、校对和优化，提高工作效率，减轻基层负担。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 三、规范部署（一）合理选择实施路径（模型选型）
    text: 对于智能问答、辅助文书起草等通用性较强、数据资源丰富的场景，需采用市场上成熟，并已完成网信部门备案的模型产品和服务。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 三、规范部署（一）合理选择实施路径（安全前提）
    text: 在保障安全和不泄露国家秘密、工作秘密和敏感信息等的前提下，充分利用互联网算力和模型资源，开展政务领域人工智能大模型部署应用。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 四、运行管理（一）明确应用管理要求（应用边界与辅助型定位、风险提示与标识）
    text: 政务部门应建立健全涵盖政务领域人工智能大模型部署应用全周期管理体系，明确应用方式和边界，落实人工智能大模型“辅助型”定位，及时解决部署与应用过程中出现的新问题。应在政务大模型应用界面显著位置设置风险提示，明确告知大模型服务的局限性，做好大模型输出内容标识。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 四、运行管理（一）明确应用管理要求（面向公众服务的内容审核）
    text: 对于智能问答、辅助办理等代表政务部门面向公众和企业提供服务的人工智能大模型应用场景，应严格执行内容审核制度流程，结合场景特点和技术能力合理采用人工审核、生成内容实时风控、多模型交叉校验等措施，防范模型“幻觉”等风险，确保输出内容不超出业务范围，保障内容准确性，维护政务部门公信力。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 四、运行管理（三）扎实做好安全管理（合规与备案）
    text: 政务部门提供人工智能大模型服务时，应遵守《生成式人工智能服务管理暂行办法》等相关规定，使用具有合法来源的数据和基础模型，依法履行算法备案和安全评估等义务，与使用者签订服务协议，明确双方权利义务。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 四、运行管理（四）严格落实保密要求
    text: 政务部门在模型训练、部署应用等过程中应加强数据安全保密和个人信息保护，坚持底线思维，严格落实“涉密不上网、上网不涉密”等保密纪律要求，采取加装保密“护栏”等措施，防止国家秘密、工作秘密和敏感信息等输入非涉密人工智能大模型，防范敏感数据汇聚、关联引发的泄密风险。制定完善人工智能大模型在政务领域应用相关保密管理制度，规范人工智能大模型选型、部署、训练、使用、废止等全流程保密管理。涉密信息系统应用人工智能大模型按照国家保密行政管理部门要求稳妥推进。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
- policy_id: guobanfa-2018-115
  title: 国务院办公厅关于全面推行行政规范性文件合法性审核机制的指导意见
  issuers:
  - 国务院办公厅
  doc_number: 国办发〔2018〕115号
  level: 政策文件
  publish_date: '2018-12-04'
  effective_date: null
  status: 现行有效
  regions:
  - 全国
  subjects:
  - 行政机关
  - 法律法规授权组织
  subject_mode: 依照
  matters:
  - 规范性文件
  - 合法性审核
  - 制定程序
  source_url: https://www.gov.cn/zhengce/content/2018-12/20/content_5350427.htm
  fetched_at: '2026-10-02T00:00:00Z'
  verification: 已核（官方来源）
  notes: 中国政府网元数据：发文机关 国务院办公厅；成文日期 2018年12月04日；发布日期 2018年12月20日；索引号 000014349/2018-00216；文末署“国务院办公厅 2018年12月4日（此件公开发布）”。publish_date
    取成文日期，公开发布日期为2018-12-20。指导意见无施行日期条款，effective_date 为 null。审核范围外的内部文件（原文）：行政机关内部执行的管理规范、工作制度、机构编制、会议纪要、工作方案、请示报告及表彰奖惩、人事任免等文件。司法部负责组织协调、督促指导贯彻落实。status：中国政府网页面无失效标注，截至2026-10-02检索未发现废止/失效决定（属“未见反证”，非数据库状态字段）。
  articles:
  - article_no: 开篇（规范性文件定义）
    text: 制定行政规范性文件（以下简称规范性文件）是行政机关或者经法律、法规授权的具有管理公共事务职能的组织（以下统称行政机关）依法履行职能的重要方式。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、（三）明确审核范围
    text: 各地区、各部门要结合工作实际，从制定主体、公文种类、管理事项等方面，确定纳入规范性文件合法性审核的标准和范围，编制规范性文件制定主体清单，明确规范性文件的公文种类，列明规范性文件管理事项类别。凡涉及公民、法人和其他组织权利义务的规范性文件，均要纳入合法性审核范围，确保实现全覆盖，做到应审必审。行政机关内部执行的管理规范、工作制度、机构编制、会议纪要、工作方案、请示报告及表彰奖惩、人事任免等文件，不纳入规范性文件合法性审核范围。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、（五）规范审核程序（审核时限）
    text: 除为了预防、应对和处置突发事件，或者执行上级机关的紧急命令和决定需要立即制定实施规范性文件等外，合法性审核时间一般不少于5个工作日，最长不超过15个工作日。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、（六）明确审核职责（审核内容）
    text: 审核机构要认真履行审核职责，防止重形式、轻内容、走过场，严格审核以下内容：制定主体是否合法；是否超越制定机关法定职权；内容是否符合宪法、法律、法规、规章和国家政策规定；是否违法设立行政许可、行政处罚、行政强制、行政征收、行政收费等事项；是否存在没有法律、法规依据作出减损公民、法人和其他组织合法权益或者增加其义务的情形；是否存在没有法律、法规依据作出增加本单位权力或者减少本单位法定职责的情形；是否违反规范性文件制定程序。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、（七）强化审核责任
    text: 不得以征求意见、会签、参加审议等方式代替合法性审核。未经合法性审核或者经审核不合法的文件，不得提交集体审议。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
- policy_id: gongping-jingzheng-2024
  title: 公平竞争审查条例
  issuers:
  - 国务院
  doc_number: 国务院令第783号
  level: 法律法规
  publish_date: '2024-06-06'
  effective_date: '2024-08-01'
  status: 现行有效
  regions:
  - 全国
  subjects:
  - 行政机关
  - 法律法规授权组织
  subject_mode: 依照
  matters:
  - 公平竞争审查
  - 经营者经济活动
  - 政策措施
  source_url: https://www.gov.cn/gongbao/2024/issue_11426/202406/content_6959686.html
  fetched_at: '2026-10-02T00:00:00Z'
  verification: 已核（官方来源）
  notes: 来源：国务院公报2024年第18号（中华人民共和国国务院令第783号，总理李强，2024年6月6日）。国家法律法规数据库（flk.npc.gov.cn）检索：行政法规，公布2024-06-06，施行2024-08-01，时效性“有效”（bbbs=ff8081819014e99a019025b8cdd249fd，2026-10-02检索）。第八条至第十一条为审查标准，第十二条为例外情形（均未在此摘录）。
  articles:
  - article_no: 国务院令第783号
    text: 《公平竞争审查条例》已经2024年5月11日国务院第32次常务会议通过，现予公布，自2024年8月1日起施行。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第二条（审查对象与主体）
    text: 第二条 起草涉及经营者经济活动的法律、行政法规、地方性法规、规章、规范性文件以及具体政策措施（以下统称政策措施），行政机关和法律、法规授权的具有管理公共事务职能的组织（以下统称起草单位）应当依照本条例规定开展公平竞争审查。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第十三条（部门出台的政策措施）
    text: '第十三条 拟由部门出台的政策措施，由起草单位在起草阶段开展公平竞争审查。

      拟由多个部门联合出台的政策措施，由牵头起草单位在起草阶段开展公平竞争审查。'
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第十四条（政府出台或提请人大审议的政策措施）
    text: 第十四条 拟由县级以上人民政府出台或者提请本级人民代表大会及其常务委员会审议的政策措施，由本级人民政府市场监督管理部门会同起草单位在起草阶段开展公平竞争审查。起草单位应当开展初审，并将政策措施草案和初审意见送市场监督管理部门审查。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第十八条（未经审查不得出台）
    text: 第十八条 政策措施未经公平竞争审查，或者经公平竞争审查认为违反本条例第八条至第十一条规定且不符合第十二条规定情形的，不得出台。
