  - article_no: 7.3.5.1
    chapter: 加盖印章的公文
    text: 成文日期一般右空四字编排；印章用红色，不得出现空白印章；以成文日期为准居中编排发文机关署名；使发文机关署名和成文日期居印章中心偏下位置；印章顶端应当上距正文（或附件说明）一行之内；印章之间排列整齐、互不相交或相切；每排印章两端不得超出版心
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
