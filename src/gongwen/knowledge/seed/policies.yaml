  - article_no: 7.2.5
    chapter: 发文字号
    text: 编排在发文机关标志下空二行位置，居中排布；年份、发文顺序号用阿拉伯数字标注；年份应标全称，用六角括号“〔〕”括入；发文顺序号不加“第”字，不编虚位（即 1 不编为 01）；在阿拉伯数字后加“号”字；上行文的发文字号居左空一字编排，与最后一个签发人姓名处在同一行
