  - 政务部门
  subject_mode: 依照
  matters:
  - 人工智能
  - 大模型
  - 辅助文书起草
  - 保密
  - 数据安全
  source_url: https://www.cac.gov.cn/2025-10/10/c_1761819469929310.htm
  fetched_at: '2026-10-02T00:00:00Z'
  verification: 已核（官方来源）
  notes: 全文页（中国网信网，2025年10月10日19:53）未载发文机关；发文机关依据同日中国网信网新闻稿“中央网信办、国家发展改革委近日联合印发”（https://www.cac.gov.cn/2025-10/10/c_1761819469876932.htm），新华网同日20:12转载（来源：“网信中国”微信公众号）。确切印发日期未公开（“近日”），publish_date
    取官方公开发布日期2025-10-10。未见文号；文件无施行日期条款，故 effective_date 为 null。新闻稿称其落实《关于深入实施“人工智能+”行动的意见》要求。status：截至2026-10-02未检索到修订/调整版本（文件自述将“进行动态调整”）。
  articles:
  - article_no: 前言（定位与动态调整）
    text: 本指引主要为各级政务部门提供人工智能大模型部署应用的工作导向和基本参照，将根据实践进展，结合人工智能大模型发展和应用的新形势、新要求，进行动态调整。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、应用场景（三）机关办公类 第7项 辅助文书起草
    text: 7.辅助文书起草。利用大语言模型的生成能力，通过构建本地知识库和预设模板，为工作人员提供写作建议、辅助起草文书，对格式和内容等进行检查、校对和优化，提高工作效率，减轻基层负担。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 三、规范部署（一）合理选择实施路径（模型选型）
    text: 对于智能问答、辅助文书起草等通用性较强、数据资源丰富的场景，需采用市场上成熟，并已完成网信部门备案的模型产品和服务。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 三、规范部署（一）合理选择实施路径（安全前提）
    text: 在保障安全和不泄露国家秘密、工作秘密和敏感信息等的前提下，充分利用互联网算力和模型资源，开展政务领域人工智能大模型部署应用。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 四、运行管理（一）明确应用管理要求（应用边界与辅助型定位、风险提示与标识）
    text: 政务部门应建立健全涵盖政务领域人工智能大模型部署应用全周期管理体系，明确应用方式和边界，落实人工智能大模型“辅助型”定位，及时解决部署与应用过程中出现的新问题。应在政务大模型应用界面显著位置设置风险提示，明确告知大模型服务的局限性，做好大模型输出内容标识。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 四、运行管理（一）明确应用管理要求（面向公众服务的内容审核）
    text: 对于智能问答、辅助办理等代表政务部门面向公众和企业提供服务的人工智能大模型应用场景，应严格执行内容审核制度流程，结合场景特点和技术能力合理采用人工审核、生成内容实时风控、多模型交叉校验等措施，防范模型“幻觉”等风险，确保输出内容不超出业务范围，保障内容准确性，维护政务部门公信力。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 四、运行管理（三）扎实做好安全管理（合规与备案）
    text: 政务部门提供人工智能大模型服务时，应遵守《生成式人工智能服务管理暂行办法》等相关规定，使用具有合法来源的数据和基础模型，依法履行算法备案和安全评估等义务，与使用者签订服务协议，明确双方权利义务。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 四、运行管理（四）严格落实保密要求
    text: 政务部门在模型训练、部署应用等过程中应加强数据安全保密和个人信息保护，坚持底线思维，严格落实“涉密不上网、上网不涉密”等保密纪律要求，采取加装保密“护栏”等措施，防止国家秘密、工作秘密和敏感信息等输入非涉密人工智能大模型，防范敏感数据汇聚、关联引发的泄密风险。制定完善人工智能大模型在政务领域应用相关保密管理制度，规范人工智能大模型选型、部署、训练、使用、废止等全流程保密管理。涉密信息系统应用人工智能大模型按照国家保密行政管理部门要求稳妥推进。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  basis_role: procedural
- policy_id: guobanfa-2018-115
  title: 国务院办公厅关于全面推行行政规范性文件合法性审核机制的指导意见
  issuers:
  - 国务院办公厅
  doc_number: 国办发〔2018〕115号
  level: 政策文件
  publish_date: '2018-12-04'
  effective_date: null
  status: 现行有效
  regions:
  - 全国
  subjects:
