  verification: 已核（官方来源）
  notes: 来源：国务院公报2024年第18号（中华人民共和国国务院令第783号，总理李强，2024年6月6日）。国家法律法规数据库（flk.npc.gov.cn）检索：行政法规，公布2024-06-06，施行2024-08-01，时效性“有效”（bbbs=ff8081819014e99a019025b8cdd249fd，2026-10-02检索）。第八条至第十一条为审查标准，第十二条为例外情形（均未在此摘录）。
  articles:
  - article_no: 国务院令第783号
    text: 《公平竞争审查条例》已经2024年5月11日国务院第32次常务会议通过，现予公布，自2024年8月1日起施行。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第二条（审查对象与主体）
    text: 第二条 起草涉及经营者经济活动的法律、行政法规、地方性法规、规章、规范性文件以及具体政策措施（以下统称政策措施），行政机关和法律、法规授权的具有管理公共事务职能的组织（以下统称起草单位）应当依照本条例规定开展公平竞争审查。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第十三条（部门出台的政策措施）
    text: '第十三条 拟由部门出台的政策措施，由起草单位在起草阶段开展公平竞争审查。

      拟由多个部门联合出台的政策措施，由牵头起草单位在起草阶段开展公平竞争审查。'
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第十四条（政府出台或提请人大审议的政策措施）
    text: 第十四条 拟由县级以上人民政府出台或者提请本级人民代表大会及其常务委员会审议的政策措施，由本级人民政府市场监督管理部门会同起草单位在起草阶段开展公平竞争审查。起草单位应当开展初审，并将政策措施草案和初审意见送市场监督管理部门审查。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第十八条（未经审查不得出台）
    text: 第十八条 政策措施未经公平竞争审查，或者经公平竞争审查认为违反本条例第八条至第十一条规定且不符合第十二条规定情形的，不得出台。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第二十七条（施行）
    text: 第二十七条 本条例自2024年8月1日起施行。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  basis_role: procedural
