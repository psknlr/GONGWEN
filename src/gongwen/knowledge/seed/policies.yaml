- policy_id: qingshi-baogao-tiaoli-2019
  title: 中国共产党重大事项请示报告条例
  issuers:
  - 中共中央
  doc_number: null
  level: 条例
  publish_date: '2019-02-28'
  effective_date: '2019-01-31'
  status: 现行有效
  regions:
  - 全国
  subjects:
  - 党组织
  subject_mode: 依照
  matters:
  - 请示报告
  - 重大事项
  - 一文一事
  source_url: https://www.gov.cn/zhengce/2019-02/28/content_5369363.htm
  fetched_at: '2026-10-02T00:00:00Z'
  verification: 部分核实（见备注）
  notes: publish_date = 新华社公开发布日期（新华社北京2019年2月28日电“近日，中共中央印发了”；中国政府网2019-02-28 18:03，来源新华社）。中共中央内部印发的确切日期未在权威来源中公开，故未填写——这是唯一未核实的日期项。2019年1月25日中共中央政治局会议审议该条例（新华社报道，最高人民法院网转载：https://www.court.gov.cn/xinshidai/xiangqing/140891.html）；第四十八条规定2019年1月31日起施行。所谓“2019年1月
    中共中央印发”的说法与政治局审议日期和施行日期一致，但未直接证实印发日期。公开稿未载文号或题注；全文共8章48条（据中国政府网文本清点）。confidence 为 partially_verified 仅因所问的内部印发日期无法核实，其余已填字段均已核实。status：截至2026-10-02未检索到修订（2025年修订的是另一部《中国共产党工作机关条例》），党内法规无公开时效数据库，属“未见反证”。
  articles:
  - article_no: 第六条第二款（逐级请示报告）
    text: 请示报告应当逐级进行，一般不得越级请示报告。特殊情况下，可以按照有关规定直接向更高层级党组织请示报告。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第二十条（请示一文一事）
    text: 第二十条 提出请示应当阐明请求事项及相关理由。报送请示应当一文一事，不得在报告等非请示性公文中夹带请示事项。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第二十四条（报告要求与字数）
    text: 第二十四条 报告应当具有实质性内容和参考价值，有助于上级党组织了解情况、科学决策，力戒空洞无物、评功摆好、搞形式主义。报告应当简明扼要、文风质朴，呈报党中央的综合报告一般在5000字以内，专项报告一般在3000字以内，情况复杂、确有必要详细报告的有关内容可以通过附件反映。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第四十八条（施行）
    text: 第四十八条 本条例自2019年1月31日起施行。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  basis_role: procedural
