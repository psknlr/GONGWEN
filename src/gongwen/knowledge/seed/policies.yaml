    chapter: 公文格式各要素的划分
    text: 划分为版头、主体、版记三部分；公文首页红色分隔线以上的部分称为版头；公文首页红色分隔线（不含）以下、公文末页首条分隔线（不含）以上的部分称为主体；公文末页首条分隔线以下、末条分隔线以上的部分称为版记；页码位于版心外
