  - article_no: 7.2.4
    chapter: 发文机关标志
    text: 由发文机关全称或者规范化简称加“文件”二字组成；也可以使用发文机关全称或者规范化简称；居中排布，上边缘至版心上边缘为 35 mm；推荐使用小标宋体字，颜色为红色；一般应当将主办机关名称排列在前；如有“文件”二字，应当置于发文机关名称右侧，以联署发文机关名称为准上下居中排布
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
