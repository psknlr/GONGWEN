  - article_no: 7.3.6
    chapter: 附注
    text: 居左空二字加圆括号编排在成文日期下一行
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 附注
  - article_no: 7.3.7
    chapter: 附件
    text: 附件应当另面编排，并在版记之前，与公文正文一起装订；“附件”二字及附件顺序号用 3 号黑体字顶格编排在版心左上角第一行；附件标题居中编排在版心第三行；附件顺序号和附件标题应当与附件说明的表述一致；附件格式要求同正文；应当在附件左上角第一行顶格编排公文的发文字号并在其后标注“附件”二字及附件顺序号
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 附件
  - article_no: 7.4.1
    chapter: 版记中的分隔线
    text: 版记中的分隔线与版心等宽；首条分隔线和末条分隔线用粗线（推荐高度为 0.35 mm）；中间的分隔线用细线（推荐高度为 0.25 mm）；首条分隔线位于版记中第一个要素之上；末条分隔线与公文最后一面的版心下边缘重合
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 版记中的分隔线
  - article_no: 7.4.2
    chapter: 抄送机关
    text: 一般用 4 号仿宋体字；在印发机关和印发日期之上一行、左右各空一字编排；“抄送”二字后加全角冒号和抄送机关名称；回行时与冒号后的首字对齐；最后一个抄送机关名称后标句号；应当将主送机关置于抄送机关之上一行，之间不加分隔线
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 抄送机关
  - article_no: 7.4.3
    chapter: 印发机关和印发日期
    text: 一般用 4 号仿宋体字，编排在末条分隔线之上；印发机关左空一字，印发日期右空一字；月、日不编虚位（即 1 不编为 01），后加“印发”二字；应当将其与印发机关和印发日期用一条细分隔线隔开
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 印发机关和印发日期
  - article_no: '7.5'
    chapter: 页码
    text: 一般用 4 号半角宋体阿拉伯数字；编排在公文版心下边缘之下；数字左右各放一条一字线；一字线上距版心下边缘 7 mm；单页码居右空一字，双页码居左空一字；公文的版记页前有空白页的，空白页和版记页均不编排页码；公文的附件与正文一起装订时，页码应当连续编排
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 页码
  - article_no: '8'
    chapter: 公文中的横排表格
    text: A4 纸型的表格横排时，页码位置与公文其他页码保持一致；单页码表头在订口一边，双页码表头在切口一边
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 公文中的横排表格
  - article_no: '9'
    chapter: 公文中计量单位、标点符号和数字的用法
    text: 计量单位的用法应当符合 GB 3100、GB 3101 和 GB 3102（所有部分）；标点符号的用法应当符合 GB/T 15834；数字用法应当符合 GB/T 15835
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 公文中计量单位、标点符号和数字的用法
  - article_no: '10.1'
    chapter: 信函格式
    text: 上边缘至上页边为 30 mm；推荐使用红色小标宋体字；联合行文时，使用主办机关标志；发文机关标志下 4 mm 处印一条红色双线（上粗下细）；距下页边 20 mm 处印一条红色双线（上细下粗）；线长均为 170 mm，居中排布；第一个要素与该线的距离为
      3 号汉字高度的 7/8；发文字号顶格居版心右边缘编排在第一条红色双线下；标题居中编排，与其上最后一个要素相距二行；首页不显示页码；版记不加印发机关和印发日期、分隔线，位于公文最后一面版心内最下方
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 信函格式
  - article_no: '10.2'
    chapter: 命令（令）格式
    text: 发文机关标志由发文机关全称加“命令”或“令”字组成；居中排布，上边缘至版心上边缘为 20 mm；推荐使用红色小标宋体字；发文机关标志下空二行居中编排令号，令号下空二行编排正文；签发人职务、签名章和成文日期的编排见 7.3.5.3
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 命令（令）格式
  - article_no: '10.3'
    chapter: 纪要格式
    text: 纪要标志由“×××××纪要”组成；居中排布，上边缘至版心上边缘为 35 mm；推荐使用红色小标宋体字；标注出席人员名单，一般用 3 号黑体字；在正文或附件说明下空一行左空二字编排“出席”二字，后标全角冒号；冒号后用 3 号仿宋体字标注出席人单位、姓名；纪要格式可以根据实际制定
    verbatim: true
    verification: 已核（条款号与要点短语对照公开印刷本扫描件与文本本逐字核对）
    tags:
    - 格式
    - 纪要格式
  basis_role: procedural
