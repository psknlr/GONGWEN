  - 国家秘密
  - 工作秘密
  - 密级
  - 保密期限
  source_url: http://www.npc.gov.cn/npc/c2/c30834/202402/t20240227_434859.html
  fetched_at: '2026-10-02T00:00:00Z'
  verification: 已核（官方来源）
  notes: 主席令第二十号公布。2024年2月27日第十四届全国人大常委会第八次会议第二次修订；主席令第二十号（习近平，2024年2月27日）公布，2024年5月1日起施行（主席令原文见人民日报2024-02-28第10版 https://paper.people.com.cn/rmrb/html/2024-02/28/nw.D110000renmrb_20240228_1-10.htm）。保密期限上限在第二十条第二款。“工作秘密”一词全法仅见于第六十四条（第六章
    附则）：以“不属于国家秘密但泄露后会造成一定不利影响的事项”界定其适用对象（未单设“工作秘密是指……”式定义条款），并规定工作秘密管理办法另行规定。国家法律法规数据库检索：2024年版“有效”，2010年版“已修改”（2026-10-02）。相关：同库显示《中华人民共和国保守国家秘密法实施条例》（国务院）公布2024-07-10、施行2024-09-01、有效——仅核对了数据库元数据，未核对条文。
  articles:
  - article_no: 题注（修订沿革）
    text: （1988年9月5日第七届全国人民代表大会常务委员会第三次会议通过 2010年4月29日第十一届全国人民代表大会常务委员会第十四次会议第一次修订 2024年2月27日第十四届全国人民代表大会常务委员会第八次会议第二次修订）
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第十四条第一款（密级）
    text: 第十四条 国家秘密的密级分为绝密、机密、秘密三级。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第二十条第一、二款（保密期限上限）
    text: '第二十条 国家秘密的保密期限，应当根据事项的性质和特点，按照维护国家安全和利益的需要，限定在必要的期限内；不能确定期限的，应当确定解密的条件。

      国家秘密的保密期限，除另有规定外，绝密级不超过三十年，机密级不超过二十年，秘密级不超过十年。'
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第二十二条（国家秘密标志）
    text: '第二十二条 机关、单位对承载国家秘密的纸介质、光介质、电磁介质等载体（以下简称国家秘密载体）以及属于国家秘密的设备、产品，应当作出国家秘密标志。

      涉及国家秘密的电子文件应当按照国家有关规定作出国家秘密标志。

      不属于国家秘密的，不得作出国家秘密标志。'
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第六十四条（工作秘密）
    text: 第六十四条 机关、单位对履行职能过程中产生或者获取的不属于国家秘密但泄露后会造成一定不利影响的事项，适用工作秘密管理办法采取必要的保护措施。工作秘密管理办法另行规定。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 第六十五条（施行）
    text: 第六十五条 本法自2024年5月1日起施行。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
