  - article_no: 7.3.5.3
    chapter: 加盖签发人签名章的公文
    text: 在正文（或附件说明）下空二行右空四字加盖签发人签名章；签名章左空二字标注签发人职务；在签发人签名章下空一行右空四字编排成文日期；每行只编排一个机关的签发人职务、签名章；签发人职务应当标注全称；签名章一般用红色
