    - 加盖印章的公文
  - article_no: 7.3.5.2
    chapter: 不加盖印章的公文
    text: 在正文（或附件说明）下空一行右空二字编排发文机关署名；在发文机关署名下一行编排成文日期，首字比发文机关署名首字右移二字；如成文日期长于发文机关署名，应当使成文日期右空二字编排，并相应增加发文机关署名右空字数；应当先编排主办机关署名，其余发文机关署名依次向下编排
    verbatim: true
