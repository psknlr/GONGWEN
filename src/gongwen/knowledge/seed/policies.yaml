  verification: 已核（官方来源）
  notes: publish_date = 题注所载发布日期（2024年8月6日中共中央办公厅、国务院办公厅发布）；2024年7月30日中共中央政治局会议审议批准。effective_date 依据“自发布之日起施行”取题注发布日期2024-08-06。公开时间线：新华社2024-08-19（新华社北京8月19日电）报道“近日…印发了”并刊发中央办公厅负责人答记者问（https://www.news.cn/20240819/0d831fc8f9fa4e1ca98c161b878b5677/c.html），称《若干规定》共7个部分、21条具体规定，并称其“首次以党内法规形式制定出台”；全文由新华社于2025-08-06受权发布（新华社北京8月6日电，https://www.news.cn/politics/20250806/6947fa6d64ba45b6a08c74c74d1008c7/c.html；中国政府网同日16:37转载，来源新华社）。未公开文号。status：截至2026-10-02检索未发现修订或废止信息，属“未见反证”（党内法规无公开时效数据库）。
  articles:
  - article_no: 题注
    text: '（2024年7月30日中共中央政治局会议审议批准

      2024年8月6日中共中央办公厅、国务院办公厅发布）'
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 一、切实精简文件 第1条（严控文件数量）
    text: 1.严控文件数量。地方和部门发文严格实行计划管理、总量管控和发文立项制度，严格控制临时性、配套类、分工类发文。年度实际发文数量一般只减不增，超过上年度的应当向上级党委办公厅（室）书面说明。议事协调机构、部门和单位不得向下级党委和政府发布指令性公文或者在公文中提出指令性要求。加强日常动态监测，防止以“红头”变“白头”、正式改便笺、多文合一等方式规避发文数量管理。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 一、切实精简文件 第2条（提升文件质量）
    text: 2.提升文件质量。坚持“短实新”文风，除部署综合性工作外，地方和部门文件一般不超过5000字，部署专项工作或者具体任务的文件一般不超过4000字。文件应当开门见山、直奔主题，着重提出贯彻落实的政策措施，一般不必阐述形势背景、重要意义、主要原则等内容，确需阐述的应当简明扼要；加强领导、落实责任、组织保障等内容应当精炼。配套文件应当直接提出具体落实措施，不得简单照搬照抄上位文件。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 一、切实精简文件 第3条（加强评估审查）
    text: 3.加强评估审查。地方和部门制发文件应当进行与为基层减负一致性评估，加强政策性、合法合规性审查，一般不提出报送贯彻落实情况、制定配套文件的要求；除专门文件外，文件原则上不对机构编制、干部配备、工资福利待遇、创建示范、达标、“一票否决”和签订责任状等事项提出具体要求。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 结尾条款（解释与施行）
    text: 本规定由中央办公厅负责解释，自发布之日起施行。此前发布的有关规定，凡与本规定不一致的，按照本规定执行。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  basis_role: procedural
- policy_id: ai-gov-guide-2025
  title: 政务领域人工智能大模型部署应用指引
  issuers:
  - 中央网信办（中央网络安全和信息化委员会办公室）
  - 国家发展改革委
  doc_number: null
