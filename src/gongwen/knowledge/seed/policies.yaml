    text: 由“签发人”三字加全角冒号和签发人姓名组成；居右空一字，编排在发文机关标志下空二行位置；“签发人”三字用 3 号仿宋体字，签发人姓名用 3 号楷体字；一般每行排两个姓名，回行时与上一行第一个签发人姓名对齐
