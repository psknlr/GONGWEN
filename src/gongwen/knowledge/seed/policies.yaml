  - 法律法规授权组织
  subject_mode: 依照
  matters:
  - 规范性文件
  - 合法性审核
  - 制定程序
  source_url: https://www.gov.cn/zhengce/content/2018-12/20/content_5350427.htm
  fetched_at: '2026-10-02T00:00:00Z'
  verification: 已核（官方来源）
  notes: 中国政府网元数据：发文机关 国务院办公厅；成文日期 2018年12月04日；发布日期 2018年12月20日；索引号 000014349/2018-00216；文末署“国务院办公厅 2018年12月4日（此件公开发布）”。publish_date
    取成文日期，公开发布日期为2018-12-20。指导意见无施行日期条款，effective_date 为 null。审核范围外的内部文件（原文）：行政机关内部执行的管理规范、工作制度、机构编制、会议纪要、工作方案、请示报告及表彰奖惩、人事任免等文件。司法部负责组织协调、督促指导贯彻落实。status：中国政府网页面无失效标注，截至2026-10-02检索未发现废止/失效决定（属“未见反证”，非数据库状态字段）。
  articles:
  - article_no: 开篇（规范性文件定义）
    text: 制定行政规范性文件（以下简称规范性文件）是行政机关或者经法律、法规授权的具有管理公共事务职能的组织（以下统称行政机关）依法履行职能的重要方式。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、（三）明确审核范围
    text: 各地区、各部门要结合工作实际，从制定主体、公文种类、管理事项等方面，确定纳入规范性文件合法性审核的标准和范围，编制规范性文件制定主体清单，明确规范性文件的公文种类，列明规范性文件管理事项类别。凡涉及公民、法人和其他组织权利义务的规范性文件，均要纳入合法性审核范围，确保实现全覆盖，做到应审必审。行政机关内部执行的管理规范、工作制度、机构编制、会议纪要、工作方案、请示报告及表彰奖惩、人事任免等文件，不纳入规范性文件合法性审核范围。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、（五）规范审核程序（审核时限）
    text: 除为了预防、应对和处置突发事件，或者执行上级机关的紧急命令和决定需要立即制定实施规范性文件等外，合法性审核时间一般不少于5个工作日，最长不超过15个工作日。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、（六）明确审核职责（审核内容）
    text: 审核机构要认真履行审核职责，防止重形式、轻内容、走过场，严格审核以下内容：制定主体是否合法；是否超越制定机关法定职权；内容是否符合宪法、法律、法规、规章和国家政策规定；是否违法设立行政许可、行政处罚、行政强制、行政征收、行政收费等事项；是否存在没有法律、法规依据作出减损公民、法人和其他组织合法权益或者增加其义务的情形；是否存在没有法律、法规依据作出增加本单位权力或者减少本单位法定职责的情形；是否违反规范性文件制定程序。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  - article_no: 二、（七）强化审核责任
    text: 不得以征求意见、会签、参加审议等方式代替合法性审核。未经合法性审核或者经审核不合法的文件，不得提交集体审议。
    verbatim: true
    verification: 已核（官方来源逐字摘录）
  basis_role: procedural
